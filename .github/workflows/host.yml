name: host

on:
  workflow_dispatch:

concurrency:
  group: host
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned: releases/latest is unreliable (tag scheme changed, some tags have no assets).
  LLAMA_TAG: b11228
  MODELS_DIR: /home/runner/models

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: bash scripts/setup_runner.sh

      - name: Read model config
        id: model
        run: |
          id=$(jq -er .default config/models.json)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "file=$(jq -er ".models[\"$id\"].file" config/models.json)" >> "$GITHUB_OUTPUT"

      - name: Restore model cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODELS_DIR }}
          key: model-${{ steps.model.outputs.file }}-v1

      - name: Fetch model
        env:
          MODEL_ID: ${{ steps.model.outputs.id }}
        run: bash scripts/fetch_models.sh "$MODEL_ID"

      # Save right after download so a later failure does not lose the 4.7 GB fetch.
      - name: Save model cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Install llama.cpp (prebuilt, CPU)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/llama"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-delay 5 \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz" \
            | tar -xz -C "$dir" --strip-components=1
          echo "LLAMA_DIR=$dir" >> "$GITHUB_ENV"
          ver=$(LD_LIBRARY_PATH="$dir" "$dir/llama-server" --version 2>&1)
          sed -n 1p <<<"$ver"

      - name: Generate server API key
        run: |
          key=$(openssl rand -hex 24)
          echo "::add-mask::$key"
          echo "LLAMA_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Start llama-server
        env:
          MODEL_ID: ${{ steps.model.outputs.id }}
        run: bash scripts/start_llama.sh "$MODEL_ID"

      - name: Smoke test
        id: smoke
        run: bash scripts/smoke_test.sh

      - name: Notify Telegram (ready)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT_ID: ${{ secrets.TG_ALLOWED_CHAT_ID }}
          TPS: ${{ steps.smoke.outputs.tps }}
        run: |
          bash scripts/tg_notify.sh "llama-server OK (Qwen2.5-7B Q4_K_M, ~${TPS} tok/s). Switching to chat mode - ask me anything. Commands: /stop /reset /model"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bot dependencies
        run: pip install -r bot/requirements.txt

      # Blocks here for the whole chat session: bot.py deletes the webhook
      # itself (Application.run_polling does this) and long-polls Telegram
      # directly until /stop is sent in chat, the 330 min timeout hits, or
      # /stop from the worker cancels the run (only reachable before the
      # webhook comes down or after it's restored - see restore_webhook.sh).
      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT_ID: ${{ secrets.TG_ALLOWED_CHAT_ID }}
        run: python3 bot/bot.py

      # Runs on success, failure AND cancellation - see the comment in
      # restore_webhook.sh for why this calls Telegram directly instead of
      # the worker's /heal endpoint. WORKER_URL is resolved as a plain
      # assignment (not embedded in the echo below) so a Cloudflare API
      # hiccup fails this step immediately instead of silently writing an
      # empty URL forward.
      - name: Restore webhook
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_URL="$(bash scripts/resolve_worker_url.sh)"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          bash scripts/restore_webhook.sh

      # Only fires when every prior required step succeeded, i.e. bot.py
      # exited cleanly via /stop or the idle timeout (bot/idle.py) - not
      # after a failure, which "Notify failure" below already reports.
      - name: Notify Telegram (offline)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT_ID: ${{ secrets.TG_ALLOWED_CHAT_ID }}
        run: bash scripts/tg_notify.sh "Session ended. Runner offline."

      - name: Notify failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ALLOWED_CHAT_ID: ${{ secrets.TG_ALLOWED_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/tg_notify.sh "Run failed. Details: ${RUN_URL}"
